name: Lire le statut du test Al-Fatiha 1:2

on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-new-five.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Lire le post Buffer après demande de publication
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: |
          node <<'NODE'
          const token=process.env.BUFFER_API_TOKEN;
          const query=`query($input:PostInput!){post(input:$input){id text status externalLink sentAt sharedNow dueAt error{message}}}`;
          const variables={input:{id:"6af46d63dfd0aa4324ff72ae"}};
          const r=await fetch("https://api.buffer.com",{method:"POST",headers:{"content-type":"application/json",authorization:`Bearer ${token}`},body:JSON.stringify({query,variables})});
          const body=await r.json();
          if(body.errors)throw Error(JSON.stringify(body.errors));
          console.log("ÉTAT BUFFER :", JSON.stringify(body.data?.post));
          NODE
