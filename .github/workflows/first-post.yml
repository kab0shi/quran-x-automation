name: Premier tweet lunaire — 10 novembre 18h

# Déclenchement unique à la création du workflow ; le script refuse
# de programmer tout autre jour ou passé 17:58 UTC.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/first-post.yml"

permissions:
  contents: write

jobs:
  first-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Programmer le premier ayah sur @alQamarDaily pour 18h Paris
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: node src/first-post.mjs
      - name: Enregistrer la progression seulement après succès Buffer
        run: |
          git config user.name "alQamarDaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record first scheduled lunar ayah [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
