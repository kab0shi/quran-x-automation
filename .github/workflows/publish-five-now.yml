name: X — publier maintenant les cinq ayat test

# One-time trigger on workflow creation only. No schedules or button.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-five-now.yml"

permissions:
  contents: write

concurrency:
  group: alqamardaily-one-time-five
  cancel-in-progress: false

jobs:
  publish-five:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publier les cinq versets restants d'Al-Fatiha sur X
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: node src/publish-five-now.mjs
      - name: Avancer le curseur après cinq publications confirmées
        run: |
          git config user.name "alQamarDaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json public/test-five/2026-11-11/publication-results.json
          if ! git diff --cached --quiet; then
            git commit -m "Record five real Quran test tweets on X [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-publication-results
          path: public/test-five/2026-11-11/publication-results.json
          if-no-files-found: ignore
