name: Test — générer cinq images RTL sans publier

on:
  push:
    branches: [main]
    paths: [".github/workflows/test-five-generate.yml"]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm test
      - name: Générer cinq images du 11 novembre sans publier
        run: node src/test-five-generate.mjs
      - name: Archiver les cinq images publiques de test
        run: |
          git config user.name "alQamarDaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/test-five/2026-11-11/*.png public/test-five/2026-11-11/manifest.json
          git commit -m "Host five 11 November Quran RTL preview cards [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-five-images
          path: public/test-five/2026-11-11/
          retention-days: 7
