name: Publier un tweet test (verrouillé)

# Publication désactivée par défaut : lancement manuel explicite uniquement.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Pour autoriser l'envoi réel sur @alQamarDaily, taper JE_VALIDE_PUBLICATION_ALQAMARDAILY"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-tweet:
    if: ${{ inputs.confirmation == 'JE_VALIDE_PUBLICATION_ALQAMARDAILY' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Programmer le tweet test dans deux minutes
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: node src/manual-post.mjs
