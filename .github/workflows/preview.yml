name: Générer les aperçus

on:
  workflow_dispatch:
  # Safe: preview only; never schedules or publishes to Buffer/X.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.json"
      - "test/**"
      - ".github/workflows/preview.yml"

permissions:
  contents: write

concurrency:
  group: quran-preview-main
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les polices système
        run: fc-match 'Noto Naskh Arabic'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Générer avec les données réelles
        run: npm run preview:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apercus-versets
          path: public/previews/
          retention-days: 7

      - name: Héberger les aperçus validables pour Buffer
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "alQamarDaily-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/previews/*.png public/previews/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Store generated lunar previews [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
